<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>소음 방해지수 측정기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <!-- 메인 화면: 버튼 3개로 화면 3개 연결 -->
    <section id="screen-main" class="screen active">
      <h1>소음 방해지수 측정기</h1>
      <div class="controls">
        <button data-nav="screen-record">실시간 녹음 분석</button>
        <button data-nav="screen-upload">파일 업로드 분석</button>
        <button data-nav="screen-results">분석 결과 보기</button>
      </div>
    </section>

    <!-- 화면 1: 실시간 녹음 -> 백엔드 분석 요청 -->
    <section id="screen-record" class="screen">
      <button class="back" data-nav="screen-main">← 메인으로</button>
      <h2>실시간 녹음 분석</h2>
      <div class="controls">
        <button id="recordStartBtn">녹음 시작</button>
        <button id="recordStopBtn" disabled>녹음 정지</button>
        <span id="recordTimer">00:00</span>
      </div>
      <p id="recordMessage" class="message" hidden></p>
      <div id="recordResult" class="result-box" hidden></div>
    </section>

    <!-- 화면 2: 파일 업로드 -> 백엔드 분석 요청 -->
    <section id="screen-upload" class="screen">
      <button class="back" data-nav="screen-main">← 메인으로</button>
      <h2>파일 업로드 분석</h2>
      <div class="controls">
        <input type="file" id="uploadInput" accept="audio/*" />
        <button id="uploadAnalyzeBtn">분석 요청</button>
      </div>
      <p id="uploadMessage" class="message" hidden></p>
      <div id="uploadResult" class="result-box" hidden></div>
    </section>

    <!-- 화면 3: 분석 결과 리스트 + 신고 도움 -->
    <section id="screen-results" class="screen">
      <button class="back" data-nav="screen-main">← 메인으로</button>
      <h2>분석 결과</h2>
      <div class="controls">
        <button id="refreshResultsBtn">새로고침</button>
      </div>
      <div id="resultsList"></div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
